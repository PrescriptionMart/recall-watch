name: Fetch FDA early alerts

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FDA announcement feed
        run: python3 .github/scripts/fetch_alerts.py
      - name: Commit if changed
        id: commit
        run: |
          if git status --porcelain alerts.json | grep -q .; then
            git config user.name "recall-watch-bot"
            git config user.email "noreply@github.com"
            git add alerts.json
            git commit -m "Update early alerts feed"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'yes'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.commit.outputs.changed == 'yes'
        id: deployment
        uses: actions/deploy-pages@v4
